<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WhyAI</title>
</head>
<body>

<textarea id="text" rows="15" cols="80" placeholder="Paste at least ~40 words here..."></textarea>
<br>
<label for="modelSize">Model size:</label>
<select id="modelSize">
  <option value="q4">Smallest (q4, fastest, lowest accuracy)</option>
  <option value="q8">Small (q8)</option>
  <option value="fp16" selected>Medium (fp16, GPU recommended)</option>
  <option value="fp32">Largest (fp32, most accurate, slowest)</option>
</select>
<br>
<button id="detect">Detect AI</button>
<p id="result">No result yet.</p>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";

const MODEL = "onnx-community/tmr-ai-text-detector-ONNX";
const textEl = document.getElementById("text");
const detectBtn = document.getElementById("detect");
const resultEl = document.getElementById("result");
const modelSizeEl = document.getElementById("modelSize");

let detector = null;
let deviceUsed = "wasm";
let loadedSize = null;

modelSizeEl.addEventListener("change", () => {
  if (modelSizeEl.value !== loadedSize) {
    detector = null;
    resultEl.textContent = "Model size changed. It will reload on next detect.";
  }
});

function makeChunks(text) {
  const sentences = text
    .replace(/\s+/g, " ")
    .match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];

  const chunks = [];
  let current = "";

  for (const sentence of sentences) {
    const candidate = current ? current + " " + sentence : sentence;
    if (candidate.split(/\s+/).length > 330 && current) {
      chunks.push(current.trim());
      current = sentence;
    } else {
      current = candidate;
    }
  }
  if (current.trim()) chunks.push(current.trim());
  return chunks;
}

async function loadModel() {
  const size = modelSizeEl.value; // q4, q8, fp16, fp32
  if (detector && loadedSize === size) return detector;

  detectBtn.disabled = true;

  const hasWebGPU = "gpu" in navigator;

  if (hasWebGPU) {
    try {
      resultEl.textContent = `Loading ${size} model on GPU (WebGPU)... this can take a while on first run.`;
      console.log(`Attempting WebGPU load with dtype=${size}...`);

      const timeoutMs = 45000;
      const loadPromise = pipeline("text-classification", MODEL, {
        device: "webgpu",
        dtype: size,
        progress_callback: (p) => {
          if (p && p.status) console.log("WebGPU load progress:", p);
        },
      });
      const timeoutPromise = new Promise((_, reject) =>
        setTimeout(() => reject(new Error("WebGPU load timed out after 45s")), timeoutMs)
      );

      detector = await Promise.race([loadPromise, timeoutPromise]);
      deviceUsed = "webgpu";
      loadedSize = size;
      console.log("WebGPU load succeeded.");
    } catch (err) {
      console.warn("WebGPU load failed, falling back to CPU:", err);
      resultEl.textContent = "GPU load failed/timed out, falling back to CPU...";
      detector = null;
    }
  }

  if (!detector) {
    resultEl.textContent = `Loading ${size} model on CPU (WASM)...`;
    detector = await pipeline("text-classification", MODEL, {
      device: "wasm",
      dtype: size,
      progress_callback: (p) => {
        if (p && p.status) console.log("WASM load progress:", p);
      },
    });
    deviceUsed = "wasm";
    loadedSize = size;
  }

  detectBtn.disabled = false;
  return detector;
}

function getAiScore(outputs) {
  const ai = outputs.find(x => /ai|generated|machine/i.test(String(x.label)));
  if (ai) return ai.score;

  const human = outputs.find(x => /human|real/i.test(String(x.label)));
  if (human) return 1 - human.score;

  return outputs.length > 1 ? Math.max(...outputs.map(x => x.score)) : outputs[0].score;
}

detectBtn.onclick = async () => {
  const text = textEl.value.trim();

  if (!text) {
    alert("Paste some text first.");
    return;
  }

  if (text.split(/\s+/).length < 40) {
    alert("Use at least ~40 words for a meaningful result.");
    return;
  }

  detectBtn.disabled = true;
  modelSizeEl.disabled = true;
  resultEl.textContent = "Analyzing...";

  try {
    const model = await loadModel();
    const chunks = makeChunks(text);

    let weightedAi = 0;
    let totalWeight = 0;

    for (let i = 0; i < chunks.length; i++) {
      resultEl.textContent = `Analyzing chunk ${i + 1} of ${chunks.length} (${deviceUsed})...`;
      const output = await model(chunks[i], { topk: 2 });
      const ai = getAiScore(output);
      const weight = Math.max(1, chunks[i].split(/\s+/).length);
      weightedAi += ai * weight;
      totalWeight += weight;
    }

    const aiScore = Math.max(0, Math.min(1, weightedAi / totalWeight));
    const pct = Math.round(aiScore * 100);

    let label;
    if (pct >= 75) label = "Likely AI-generated";
    else if (pct >= 50) label = "More likely AI";
    else if (pct >= 30) label = "Uncertain";
    else label = "Likely human-written";

    resultEl.textContent = `${label} (${pct}% AI signal, ${chunks.length} chunk(s), ran on ${deviceUsed})`;
  } catch (err) {
    console.error(err);
    resultEl.textContent = "Detection failed: " + String(err?.message || err);
  } finally {
    detectBtn.disabled = false;
    modelSizeEl.disabled = false;
  }
};
</script>
</body>
</html>
